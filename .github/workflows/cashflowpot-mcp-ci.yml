name: CashflowPot MCP feature CI

on:
  push:
    branches:
      - feature/cashflowpot-mcp-backend
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Seed deterministic test config
        run: |
          cat > env.json <<'JSON'
          {
            "SECRET_KEY": "ci-secret-key",
            "APP_ID": "cashflowpot-ci",
            "PUBLIC_KEY": "ci-public-key",
            "ALGO": "RS256",
            "APP_SECRET": "ci-app-secret",
            "APP_ALGO": "HS256"
          }
          JSON
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
